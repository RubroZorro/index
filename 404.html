.num-404 { font-family: 'Cormorant Garamond', serif; font-size: clamp(6rem, 20vw, 12rem); font-weight: 700; line-height: 1; color: rgba(201,162,39,0.15); margin-bottom: -1rem; }
.gold-line { width: 48px; height: 2px; background: var(--gold); margin: 0 auto 2rem; }
.title { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 600; margin-bottom: 1rem; }
.title em { color: var(--gold); font-style: italic; }
.subtitle { font-size: 0.9rem; font-weight: 300; color: var(--text-muted); line-height: 1.8; margin-bottom: 2.5rem; max-width: 380px; margin-left: auto; margin-right: auto; }
.actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.btn-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--gold); color: var(--navy-deep); font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500; padding: 14px 28px; border-radius: 4px; text-decoration: none; transition: background 0.2s; }
.btn-primary:hover { background: var(--gold-light); }
.links-row { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
.link-item { font-size: 0.8rem; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
.link-item:hover { color: var(--gold); }
.logo-wrap { margin-bottom: 3rem; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; }

.bb .b1 { color: var(--gold); } .bb .b2 { color: var(--white); }
.logo-div { width: 1px; height: 38px; background: var(--border-gold); }
.logo-txt .name { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.05em; color: var(--white); text-transform: uppercase; line-height: 1.15; text-align: left; }
.logo-txt .sub { font-size: 0.58rem; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--border-gold); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
</style>
